name: Knowledge Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/knowledge.yml'
      - 'apps/knowledge-service/**'
      - 'packages/knowledge-contract/**'
      - 'packages/knowledge-client/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup minimum Node
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: apps/knowledge-service/.node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install without desktop or native lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Typecheck knowledge workspaces
        run: npm run typecheck:knowledge
      - name: Test synthetic runtime and parser boundaries
        run: npm run test:knowledge
      - name: Build audited runtime candidates
        run: npm run build:knowledge
      - name: Upload code-only candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: knowledge-${{ steps.node.outputs.node-version }}-${{ matrix.os }}
          path: |
            apps/knowledge-service/dist/api.mjs
            apps/knowledge-service/dist/worker.mjs
            apps/knowledge-service/dist/maintenance.mjs
            apps/knowledge-service/dist/migrate.mjs
            apps/knowledge-service/dist/check-config.mjs
            apps/knowledge-service/dist/parser.mjs
            apps/knowledge-service/dist/text-worker.mjs
            apps/knowledge-service/dist/markdown-worker.mjs
            apps/knowledge-service/dist/package.json
            apps/knowledge-service/dist/package-lock.json
            apps/knowledge-service/dist/api.env.example
            apps/knowledge-service/dist/worker.env.example
            apps/knowledge-service/dist/maintenance.env.example
            apps/knowledge-service/dist/OPERATIONS.md
            apps/knowledge-service/dist/build-meta.json
            apps/knowledge-service/dist/build-manifest.json
          if-no-files-found: error
          retention-days: 7
