name: Verify uploaded Office test release
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Office skills test release with successful source and build gates
        required: true
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: release-test
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify original test source and all successful build gates
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict')
          const { execFileSync } = require('node:child_process')
          const repo = process.env.GITHUB_REPOSITORY
          assert.equal(repo, 'fangtang-ai/fangoffice')
          const runId = process.env.SOURCE_RUN
          assert.match(runId, /^\d+$/)
          const api = path => JSON.parse(execFileSync('gh', ['api', `repos/${repo}/${path}`], { encoding: 'utf8' }))
          const run = api(`actions/runs/${runId}`)
          assert.equal(run.name, 'Release')
          assert.equal(run.event, 'workflow_dispatch')
          assert.equal(run.head_branch, 'codex/office-skill-sync')
          assert.equal(run.head_sha, 'a84e1109e20d724972347a321c46a1ea1e0d1e56')
          const jobs = api(`actions/runs/${runId}/jobs?filter=all&per_page=100`).jobs
          for (const name of ['verify release source', 'verify / test', 'verify / e2e', 'build mac', 'build win', 'build linux']) {
            assert.ok(jobs.some(job => job.name === name && job.conclusion === 'success'), `Successful gate required: ${name}`)
          }
          const source = JSON.parse(execFileSync('git', ['show', `${run.head_sha}:apps/shell/package.json`], { encoding: 'utf8' }))
          assert.equal(source.version, '0.9.13')
          assert.equal(source.version, require('./apps/shell/package.json').version)
          console.log('Verified original Office skills test source, version 0.9.13, all source and build gates')
          NODE
      - name: Download original successful build artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify original bytes and public test feeds (no upload)
        run: |
          node scripts/stage-release.cjs --artifacts dist --channel test
          node scripts/verify-published-release.cjs dist test
