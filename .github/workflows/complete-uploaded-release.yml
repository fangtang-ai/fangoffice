name: Complete uploaded release
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful release builds whose OSS upload finished before final verification failed
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: release-stable
  cancel-in-progress: false
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source run and successful test/build gates
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict')
          const { execFileSync } = require('node:child_process')
          const { appendFileSync } = require('node:fs')
          const repository = process.env.GITHUB_REPOSITORY
          const runId = process.env.SOURCE_RUN
          assert.match(runId, /^\d+$/)
          const api = path => JSON.parse(execFileSync('gh', ['api', `repos/${repository}/${path}`], { encoding: 'utf8' }))
          const run = api(`actions/runs/${runId}`)
          assert.equal(run.name, 'Release')
          assert.equal(run.head_branch, 'release/fangtang')
          assert.match(run.head_sha, /^[a-f0-9]{40}$/)
          execFileSync('git', ['merge-base', '--is-ancestor', run.head_sha, 'origin/release/fangtang'])
          const jobs = api(`actions/runs/${runId}/jobs?per_page=100`).jobs
          for (const name of ['verify release source', 'verify / test', 'verify / e2e', 'build mac', 'build win', 'build linux']) {
            assert.equal(jobs.find(job => job.name === name)?.conclusion, 'success', `Required successful gate: ${name}`)
          }
          const source = JSON.parse(execFileSync('git', ['show', `${run.head_sha}:apps/shell/package.json`], { encoding: 'utf8' }))
          const current = require('./apps/shell/package.json')
          assert.equal(source.version, current.version)
          appendFileSync(process.env.GITHUB_ENV, `SOURCE_SHA=${run.head_sha}\n`)
          console.log(`Verified release source ${run.head_sha}, version ${source.version}, all test/build gates passed`)
          NODE
      - name: Download original successful build artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Stage original bytes and verify published OSS without writing
        run: |
          node scripts/stage-release.cjs --artifacts dist --channel stable
          node scripts/verify-published-release.cjs dist stable
      - name: Complete GitHub release from verified original bytes
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./apps/shell/package.json').version")
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            ACTUAL=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)
            [ "$ACTUAL" = "$SOURCE_SHA" ] || { echo 'Release tag points to another source' >&2; exit 1; }
          else
            gh release create "$TAG" --draft --target "$SOURCE_SHA" --title "方塘Office $TAG" --generate-notes
          fi
          find dist -maxdepth 1 -type f ! -name 'fangtang-build-env.txt' -exec gh release upload "$TAG" --clobber {} +
          gh release edit "$TAG" --draft=false
