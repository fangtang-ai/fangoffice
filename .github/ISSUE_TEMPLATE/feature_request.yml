name: Feature request
description: Suggest a new capability or an improvement
labels: [enhancement]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - 方塘Office Docs (docs)
        - 方塘Office Sheets (sheets)
        - 方塘Office Slides (slides)
        - 方塘Office PDF (pdf)
        - 方塘Office Markdown (markdown)
        - Shell / home screen
        - AI panel / providers
        - Whole suite
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is currently hard or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Alternatives you considered are welcome too.
